<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app" role="main">
    <div class="calculator" role="region" aria-label="Calculator">

      <!-- Display area -->
      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="display__expression" id="expression" aria-label="Current expression" role="status"></div>
        <div class="display__result-row">
          <output class="display__result" id="result" aria-label="Current result">0</output>
          <button
            class="btn-copy"
            id="btn-copy"
            type="button"
            aria-label="Copy result to clipboard"
            title="Copy result"
          >Copy</button>
        </div>
      </div>

      <!-- Button grid -->
      <div class="btn-grid" role="group" aria-label="Calculator buttons">

        <!-- Row 1 -->
        <button class="btn btn--function" type="button" data-action="clear" aria-label="Clear">C</button>
        <button class="btn btn--function" type="button" data-action="backspace" aria-label="Backspace">⌫</button>
        <div class="btn-grid__spacer" aria-hidden="true"></div>
        <button class="btn btn--operator" type="button" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button class="btn btn--digit" type="button" data-action="digit" data-value="7" aria-label="7">7</button>
        <button class="btn btn--digit" type="button" data-action="digit" data-value="8" aria-label="8">8</button>
        <button class="btn btn--digit" type="button" data-action="digit" data-value="9" aria-label="9">9</button>
        <button class="btn btn--operator" type="button" data-action="operator" data-value="×" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button class="btn btn--digit" type="button" data-action="digit" data-value="4" aria-label="4">4</button>
        <button class="btn btn--digit" type="button" data-action="digit" data-value="5" aria-label="5">5</button>
        <button class="btn btn--digit" type="button" data-action="digit" data-value="6" aria-label="6">6</button>
        <button class="btn btn--operator" type="button" data-action="operator" data-value="−" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button class="btn btn--digit" type="button" data-action="digit" data-value="1" aria-label="1">1</button>
        <button class="btn btn--digit" type="button" data-action="digit" data-value="2" aria-label="2">2</button>
        <button class="btn btn--digit" type="button" data-action="digit" data-value="3" aria-label="3">3</button>
        <button class="btn btn--operator" type="button" data-action="operator" data-value="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button class="btn btn--digit btn--zero" type="button" data-action="digit" data-value="0" aria-label="0">0</button>
        <button class="btn btn--digit" type="button" data-action="decimal" data-value="." aria-label="Decimal point">.</button>
        <button class="btn btn--equals" type="button" data-action="equals" aria-label="Equals">=</button>

      </div>
    </div>

    <!-- History panel -->
    <section class="history" aria-label="Calculation history">
      <details class="history__details" open>
        <summary class="history__summary">History</summary>
        <ul class="history__list" id="history-list" aria-label="Recent calculations" role="list">
          <!-- Entries injected by app.js -->
        </ul>
        <p class="history__empty" id="history-empty" aria-live="polite">No calculations yet.</p>
      </details>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
